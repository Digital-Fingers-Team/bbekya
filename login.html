<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEKYA · Login</title>
  <!-- Added Dexie CDN for userId integration -->
  <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
  <style>
    /* (existing styles – unchanged) */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 32px;
      box-shadow: 0 20px 40px -10px rgba(15, 81, 50, 0.15), 0 8px 20px -6px rgba(15, 81, 50, 0.1);
      padding: 2.5rem 2rem;
      border: 1px solid rgba(15, 81, 50, 0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .login-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 28px 48px -12px rgba(15, 81, 50, 0.25);
    }

    .logo-img {
      height: 60px;
      margin-bottom: 1rem;
    }

    h1 {
      color: #0f5132;
      font-weight: 600;
      font-size: 2.2rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }

    .sub {
      color: #0f5132;
      font-size: 0.95rem;
      opacity: 0.7;
      margin-bottom: 2.5rem;
      border-left: 4px solid #0f5132;
      padding-left: 0.75rem;
      font-weight: 400;
    }

    .field {
      margin-bottom: 2rem;
    }

    label {
      display: block;
      color: #0f5132;
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 0.5rem;
    }

    input {
      width: 100%;
      background: #ffffff;
      border: 2px solid rgba(15, 81, 50, 0.25);
      border-radius: 20px;
      padding: 0.9rem 1.4rem;
      font-size: 1rem;
      color: #0f5132;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: #0f5132;
      box-shadow: 0 0 0 4px rgba(15, 81, 50, 0.15);
    }

    input::placeholder {
      color: #0f5132;
      opacity: 0.4;
      font-weight: 300;
    }

    button {
      width: 100%;
      background: #0f5132;
      border: none;
      border-radius: 40px;
      padding: 1rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      margin-top: 0.5rem;
      letter-spacing: 0.5px;
      border: 1px solid #0f5132;
    }

    button:hover {
      background: #0d6e3a;
      box-shadow: 0 8px 18px -6px rgba(15, 81, 50, 0.4);
    }

    button:active {
      transform: scale(0.97);
    }

    .error-message {
      color: #d32f2f;
      font-size: 0.9rem;
      margin-top: 1.2rem;
      text-align: center;
      font-weight: 500;
      min-height: 1.5rem;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .error-message.show {
      opacity: 1;
    }

    .register-link {
      text-align: center;
      margin-top: 2rem;
    }

    .register-link a {
      color: #0f5132;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      border-bottom: 1px dashed rgba(15, 81, 50, 0.3);
      transition: border-color 0.2s;
    }

    .register-link a:hover {
      border-bottom-color: #0f5132;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 2rem 1.5rem;
      }
      h1 {
        font-size: 2rem;
      }
    }

    @media (max-width: 360px) {
      .login-card {
        padding: 1.5rem 1rem;
      }
      input, button {
        padding: 0.8rem 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <a href="index.html" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center;">
      <img src="logo.png" alt="Logo" class="logo-img">
      <h1>BEKYA</h1>
    </a>
    <div class="sub">welcome back</div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="role">Role</label>
        <select id="role" name="role" style="width: 100%; background: #ffffff; border: 2px solid rgba(15, 81, 50, 0.25); border-radius: 20px; padding: 0.9rem 1.4rem; font-size: 1rem; color: #0f5132; outline: none; appearance: none; cursor: pointer;">
          <option value="seller">Seller</option>
          <option value="outlet">Outlet</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="enter your username" autocomplete="off">
      </div>

      <div class="field" id="passwordField" style="display: none;">
        <label for="password">Password (Admins only)</label>
        <input type="password" id="password" name="password" placeholder="enter admin password">
      </div>

      <button type="submit" id="loginBtn">Log in →</button>
      <div id="errorMessage" class="error-message"></div>
    </form>

    <div class="register-link">
      <a href="FORM-BEKYA.html">don't have an account? register</a>
    </div>
  </div>

  <script>
    (function() {
      // ----- Added for userId integration: Dexie setup -----
      const db = new Dexie('BEKYADatabase');
      db.version(1).stores({
        Users: '++id, name, phone, role'
      });

      // Get DOM elements
      const form = document.getElementById('loginForm');
      const roleSelect = document.getElementById('role');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const passwordField = document.getElementById('passwordField');
      const errorDiv = document.getElementById('errorMessage');

      // Show password field if role is 'admin'
      roleSelect.addEventListener('change', () => {
        if (roleSelect.value === 'admin') {
          passwordField.style.display = 'block';
        } else {
          passwordField.style.display = 'none';
        }
      });

      // Handle form submission
      form.addEventListener('submit', async function(event) {
        event.preventDefault();

        const role = roleSelect.value;
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        errorDiv.textContent = '';
        errorDiv.classList.remove('show');

        if (!username) {
          errorDiv.textContent = 'Please enter your username.';
          errorDiv.classList.add('show');
          return;
        }

        // --- SPECIAL ADMIN LOGIN ---
        if (role === 'admin') {
          if (username.toLowerCase() === 'admin' && password === 'admin010') {
            localStorage.setItem('currentUserId', 'admin_session');
            localStorage.setItem('userName', 'Admin');
            localStorage.setItem('userRole', 'admin');
            window.location.href = 'Admin-bekya.html';
            return;
          } else {
            errorDiv.textContent = 'Incorrect admin username or password';
            errorDiv.classList.add('show');
            return;
          }
        }

        // --- AUTHENTICATION LOGIC ---
        const storedUsers = localStorage.getItem('users');
        let users = [];

        if (storedUsers) {
          try {
            users = JSON.parse(storedUsers);
            if (!Array.isArray(users)) users = [];
          } catch (e) {
            users = [];
          }
        }

        // Find user by username AND role
        const foundUser = users.find(user => user.username === username && user.role === role);

        if (foundUser) {
          // Store user session info
          localStorage.setItem('currentUserId', foundUser.id || ''); 
          localStorage.setItem('userName', foundUser.username);
          localStorage.setItem('userPhone', foundUser.phone || '');
          localStorage.setItem('userRole', foundUser.role);

          // Local redirects
          const redirects = {
            seller: 'SELLER-FORM.html',
            outlet: 'OUTLET-FORM.html'
          };

          window.location.href = redirects[foundUser.role] || 'index.html';
        } else {
          errorDiv.textContent = 'User not found with selected role';
          errorDiv.classList.add('show');
        }
      });
    })();
  </script>
</body>
</html>
