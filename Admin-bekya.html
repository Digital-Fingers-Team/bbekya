<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEKYA · Admin Panel</title>
  <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --surface: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --border-light: #e2e8f0;
      --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      --accent-green: #0A3D2A;
      --accent-soft: #eef7f2;
      --danger: #dc2626;
      --icon-color: #0A3D2A;
      --radius: 20px;
    }

    [data-theme="dark"] {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --surface: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --border-light: #334155;
      --card-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      --accent-green: #22c55e;
      --accent-soft: rgba(34, 197, 94, 0.15);
      --danger: #ef4444;
      --icon-color: #ffffff;
      background-color: var(--bg-primary);
      color: var(--text-primary);
    }

    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Inter', system-ui, sans-serif;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      transition: all 0.3s ease;
      overflow-x: hidden;
    }

    .app-wrapper {
      display: flex;
      min-height: 100vh;
      position: relative;
    }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border-light);
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 1000;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Desktop Collapsed State */
    .sidebar.collapsed {
        margin-left: -260px;
        opacity: 0;
        pointer-events: none;
    }

    .sidebar-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.4);
        backdrop-filter: blur(4px);
        z-index: 998;
    }

    .sidebar-overlay.active {
        display: block;
    }

    .logo-container {
      padding: 0 1rem;
    }

    .logo-img {
      height: 40px;
      width: auto;
      object-fit: contain;
    }

    .logo-wrapper {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      text-decoration: none;
      color: inherit;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent-green);
      text-decoration: none;
      letter-spacing: -1px;
    }

    .sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.2rem;
      border-radius: 14px;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s ease;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      cursor: pointer;
    }

    .menu-item i {
      font-size: 1.2rem;
      width: 24px;
      color: var(--icon-color);
    }

    .menu-item:hover {
      background: var(--accent-soft);
      color: var(--accent-green);
    }

    .menu-item.active {
      background: var(--accent-green);
      color: white;
      box-shadow: 0 8px 20px rgba(10, 61, 42, 0.2);
    }

    .menu-item.logout {
      margin-top: auto;
      color: var(--danger);
    }

    .menu-item.logout:hover {
      background: #fee2e2;
    }

    /* MAIN CONTENT */
    .main-content {
      flex: 1;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
    }

    .welcome-text h1 {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .top-actions {
      display: flex;
      gap: 1rem;
    }

    .icon-btn {
      width: 45px;
      height: 45px;
      border-radius: 12px;
      border: 1px solid var(--border-light);
      background: var(--surface);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      border-color: var(--accent-green);
      color: var(--accent-green);
      transform: translateY(-2px);
    }

    /* SECTIONS */
    .section {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* STATS GRID */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .stat-card {
      background: var(--surface);
      padding: 1.5rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-light);
      box-shadow: var(--card-shadow);
    }

    .stat-label {
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent-green);
    }

    /* TABLES & LISTS */
    .content-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border-light);
      box-shadow: var(--card-shadow);
      overflow: hidden;
    }

    .card-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: var(--bg-secondary);
      padding: 1rem 1.5rem;
      text-align: left;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid var(--border-light);
      font-size: 0.95rem;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .role-badge {
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      background: var(--accent-soft);
      color: var(--accent-green);
    }

    .delete-btn {
      color: var(--danger);
      background: transparent;
      border: 1px solid #fee2e2;
      padding: 0.5rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .delete-btn:hover {
      background: #fee2e2;
      transform: scale(1.1);
    }

    .material-img {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      object-fit: cover;
      background: #eee;
    }

    /* RESPONSIVENESS */
    @media (max-width: 1024px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        height: 100vh;
        z-index: 999;
        margin-left: -260px;
        opacity: 0;
        pointer-events: none;
      }
      .sidebar.active {
        margin-left: 0;
        opacity: 1;
        pointer-events: auto;
      }
      .main-content {
        padding: 1.5rem;
      }
    }

    @media (max-width: 768px) {
      .header-bar {
        flex-direction: row;
        gap: 1rem;
        padding-top: 0.5rem;
      }
      .welcome-text h1 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body data-theme="light">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="app-wrapper">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="logo-container">
        <a href="index.html" class="logo-wrapper">
          <img src="logo.png" alt="Logo" class="logo-img">
          <span class="logo">BEKYA · Admin</span>
        </a>
      </div>
      <nav class="sidebar-menu">
        <button class="menu-item active" data-tab="home">
          <i class="fas fa-home"></i> <span>Home</span>
        </button>
        <button class="menu-item" data-tab="materials">
          <i class="fas fa-boxes"></i> <span>Materials</span>
        </button>
        <button class="menu-item" data-tab="rewards">
          <i class="fas fa-gift"></i> <span>Rewards</span>
        </button>
        <button class="menu-item" data-tab="users">
          <i class="fas fa-users"></i> <span>Users</span>
        </button>
        <button class="menu-item" data-tab="settings">
          <i class="fas fa-cog"></i> <span>Settings</span>
        </button>
        <button class="menu-item logout" id="logoutBtn">
          <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
        </button>
      </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <header class="header-bar">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button class="icon-btn" id="sidebarToggle" aria-label="Toggle Sidebar">
            <i class="fas fa-bars"></i>
          </button>
          <div class="welcome-text">
            <h1 id="sectionTitle">Dashboard Overview</h1>
          </div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="themeToggle"><i class="fas fa-sun"></i></button>
          <button class="icon-btn" id="langToggle"><i class="fas fa-globe"></i></button>
        </div>
      </header>

      <!-- HOME SECTION -->
      <section id="home" class="section active">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Total Users</div>
            <div class="stat-value" id="totalUsersCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Materials</div>
            <div class="stat-value" id="totalMaterialsCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Weight (KG)</div>
            <div class="stat-value" id="totalWeightCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Points</div>
            <div class="stat-value" id="totalPointsCount">0</div>
          </div>
        </div>
      </section>

      <!-- MATERIALS SECTION -->
      <section id="materials" class="section">
        <div class="content-card">
          <div class="card-header">
            <h2>Recent Materials</h2>
          </div>
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Image</th>
                  <th>User</th>
                  <th>Type</th>
                  <th>Weight (g)</th>
                  <th>Points</th>
                  <th>Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="materialsTableBody">
                <!-- Loaded via JS -->
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- USERS SECTION -->
      <section id="users" class="section">
        <div class="content-card">
          <div class="card-header">
            <h2>User Management</h2>
            <select id="roleFilter" style="padding: 0.5rem; border-radius: 8px; border: 1px solid var(--border-light);">
              <option value="all">All Roles</option>
              <option value="seller">Sellers</option>
              <option value="outlet">Outlets</option>
            </select>
          </div>
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Phone</th>
                  <th>Role</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="usersTableBody">
                <!-- Loaded via JS -->
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- REWARDS SECTION -->
      <section id="rewards" class="section">
        <div class="content-card">
          <div class="card-header">
            <h2>Points & Rewards Stats</h2>
          </div>
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>User</th>
                  <th>Total Points</th>
                  <th>Total Weight</th>
                  <th>Milestone</th>
                </tr>
              </thead>
              <tbody id="rewardsTableBody">
                <!-- Loaded via JS -->
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- SETTINGS SECTION -->
      <section id="settings" class="section">
        <div class="content-card" style="max-width: 500px; padding: 2rem;">
          <h2 data-i18n="settings_title">Admin Settings</h2>
          <div style="margin-top: 2rem; display: flex; flex-direction: column; gap: 1.5rem;">
            <div class="form-group">
                <label data-i18n="theme_label" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Theme</label>
                <button class="menu-item" id="settingsThemeToggle" style="border: 1px solid var(--border-light);">
                    <i class="fas fa-adjust"></i> <span data-i18n="toggle_theme">Switch Theme</span>
                </button>
            </div>
            <div class="form-group">
                <label data-i18n="lang_label" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Language</label>
                <button class="menu-item" id="settingsLangToggle" style="border: 1px solid var(--border-light);">
                    <i class="fas fa-language"></i> <span data-i18n="toggle_lang">Switch Language</span>
                </button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    (async function() {
      // ─── Dexie setup ─────────────────────────────────────
      const dbUsers = new Dexie('BEKYADatabase');
      dbUsers.version(1).stores({ Users: '++id, name, phone, role, weight, points' });

      const dbOutlet = new Dexie('RecycleOutletDB');
      dbOutlet.version(2).stores({ records: '++id, sellerName, phone, materialType, weight, timestamp, points, userId' });

      await Promise.all([dbUsers.open(), dbOutlet.open()]);

      // ─── DOM ─────────────────────────────────────────────
      const themeBtn    = document.getElementById('themeToggle');
      const langBtn     = document.getElementById('langToggle');
      const logoutBtn   = document.getElementById('logoutBtn');
      const menuItems   = document.querySelectorAll('.menu-item');
      const sections    = document.querySelectorAll('.section');
      const sectionTitle = document.getElementById('sectionTitle');
      const sidebar      = document.getElementById('sidebar');
      const sidebarToggle = document.getElementById('sidebarToggle');
      const sidebarOverlay = document.getElementById('sidebarOverlay');

      // ─── Translations ────────────────────────────────────
      const translations = {
        en: {
          home: "Home",
          materials: "Materials",
          rewards: "Rewards",
          users: "Users",
          settings: "Settings",
          logout: "Logout",
          welcome: "Dashboard Overview",
          total_users: "Total Users",
          total_mats: "Total Materials",
          total_weight: "Total Weight (KG)",
          total_pts: "Total Points",
          recent_mats: "Recent Materials",
          user_mng: "User Management",
          all_roles: "All Roles",
          sellers: "Sellers",
          outlets: "Outlets",
          points_stats: "Points & Rewards Stats",
          settings_title: "Admin Settings",
          theme_label: "Theme",
          lang_label: "Language",
          toggle_theme: "Switch Theme",
          toggle_lang: "Switch Language",
          confirm_logout: "Are you sure you want to logout?",
          confirm_del_mat: "Are you sure you want to delete this material record?",
          confirm_del_user: "Are you sure you want to delete user \"{name}\"?",
          no_mats: "No materials found",
          no_users: "No users found"
        },
        ar: {
          home: "الرئيسية",
          materials: "المواد",
          rewards: "المكافآت",
          users: "المستخدمين",
          settings: "الإعدادات",
          logout: "تسجيل الخروج",
          welcome: "نظرة عامة على لوحة التحكم",
          total_users: "إجمالي المستخدمين",
          total_mats: "إجمالي المواد",
          total_weight: "إجمالي الوزن (كجم)",
          total_pts: "إجمالي النقاط",
          recent_mats: "المواد الأخيرة",
          user_mng: "إدارة المستخدمين",
          all_roles: "كل الأدوار",
          sellers: "البائعين",
          outlets: "المنافذ",
          points_stats: "إحصائيات النقاط والمكافآت",
          settings_title: "إعدادات المسؤول",
          theme_label: "المظهر",
          lang_label: "اللغة",
          toggle_theme: "تغيير المظهر",
          toggle_lang: "تغيير اللغة",
          confirm_logout: "هل أنت متأكد من تسجيل الخروج؟",
          confirm_del_mat: "هل أنت متأكد من حذف سجل هذه المادة؟",
          confirm_del_user: "هل أنت متأكد من حذف المستخدم \"{name}\"؟",
          no_mats: "لم يتم العثور على مواد",
          no_users: "لم يتم العثور على مستخدمين"
        }
      };

      let currentLang = localStorage.getItem('adminLang') || 'en';

      function applyLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('adminLang', lang);
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (translations[lang][key]) {
            el.innerText = translations[lang][key];
          }
        });

        // Update specific text nodes
        document.querySelector('.menu-item[data-tab="home"] span').innerText = translations[lang].home;
        document.querySelector('.menu-item[data-tab="materials"] span').innerText = translations[lang].materials;
        document.querySelector('.menu-item[data-tab="rewards"] span').innerText = translations[lang].rewards;
        document.querySelector('.menu-item[data-tab="users"] span').innerText = translations[lang].users;
        document.querySelector('.menu-item[data-tab="settings"] span').innerText = translations[lang].settings;
        document.querySelector('.menu-item.logout span').innerText = translations[lang].logout;
        
        // Labels
        document.querySelectorAll('.stat-label')[0].innerText = translations[lang].total_users;
        document.querySelectorAll('.stat-label')[1].innerText = translations[lang].total_mats;
        document.querySelectorAll('.stat-label')[2].innerText = translations[lang].total_weight;
        document.querySelectorAll('.stat-label')[3].innerText = translations[lang].total_pts;

        const activeTab = document.querySelector('.menu-item.active').dataset.tab;
        sectionTitle.innerText = translations[lang][activeTab] + (activeTab === 'home' ? ' ' + (lang === 'ar' ? 'عامة' : 'Overview') : '');

        loadHomeStats();
        loadMaterials();
        loadUsers();
        loadRewards();
      }

      langBtn.addEventListener('click', () => {
        const next = currentLang === 'ar' ? 'en' : 'ar';
        applyLanguage(next);
      });

      document.getElementById('settingsLangToggle').addEventListener('click', () => {
        const next = currentLang === 'ar' ? 'en' : 'ar';
        applyLanguage(next);
      });

      // ─── Sidebar Toggle Logic ────────────────────────────
      function toggleSidebar() {
        if (window.innerWidth <= 1024) {
          sidebar.classList.toggle('active');
          sidebarOverlay.classList.toggle('active');
          sidebar.classList.remove('collapsed');
        } else {
          sidebar.classList.toggle('collapsed');
          sidebar.classList.remove('active');
          sidebarOverlay.classList.remove('active');
        }
      }

      sidebarToggle.addEventListener('click', toggleSidebar);
      sidebarOverlay.addEventListener('click', toggleSidebar);

      // Close sidebar on menu item click (mobile)
      menuItems.forEach(item => {
        item.addEventListener('click', () => {
          if (window.innerWidth <= 1024 && sidebar.classList.contains('active')) {
            toggleSidebar();
          }
        });
      });

      // ─── Navigation Logic ────────────────────────────────
      menuItems.forEach(item => {
        item.addEventListener('click', () => {
          const tab = item.dataset.tab;
          if (!tab) return;

          // Update menu active state
          menuItems.forEach(i => i.classList.remove('active'));
          item.classList.add('active');

          // Update section visibility
          sections.forEach(s => s.classList.remove('active'));
          document.getElementById(tab).classList.add('active');

          // Update title
          sectionTitle.innerText = translations[currentLang][tab] + (tab === 'home' ? (currentLang === 'ar' ? ' عامة' : ' Overview') : '');
          
          // Load data for section
          if (tab === 'home') loadHomeStats();
          if (tab === 'materials') loadMaterials();
          if (tab === 'users') loadUsers();
          if (tab === 'rewards') loadRewards();
        });
      });

      // ─── Logout ──────────────────────────────────────────
      logoutBtn.addEventListener('click', () => {
        const lang = currentLang;
        const confirmMsg = translations[lang].confirm_logout;
        if (confirm(confirmMsg)) {
            localStorage.removeItem('currentUserId');
            localStorage.removeItem('userName');
            localStorage.removeItem('userRole');
            window.location.href = 'login.html';
        }
      });

      // ─── Theme ───────────────────────────────────────────
      function setTheme(theme) {
        document.body.setAttribute('data-theme', theme);
        localStorage.setItem('adminTheme', theme);
        const icon = document.querySelector('#themeToggle i');
        icon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
      }

      themeBtn.addEventListener('click', () => {
        const next = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        setTheme(next);
      });

      document.getElementById('settingsThemeToggle').addEventListener('click', () => {
        const next = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        setTheme(next);
      });

      // ─── Data Loading Logic ──────────────────────────────
      function getSellerMaterials() {
        const stored = localStorage.getItem('materials');
        return stored ? JSON.parse(stored) : [];
      }

      async function loadHomeStats() {
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        const materials = getSellerMaterials();
        
        const totalUsers = users.length;
        const totalMaterials = materials.length;
        const totalWeight = materials.reduce((sum, m) => sum + (Number(m.weight) || 0), 0) / 1000;
        const totalPoints = materials.reduce((sum, m) => sum + (Number(m.points) || 0), 0);

        document.getElementById('totalUsersCount').innerText = totalUsers;
        document.getElementById('totalMaterialsCount').innerText = totalMaterials;
        document.getElementById('totalWeightCount').innerText = totalWeight.toFixed(2);
        document.getElementById('totalPointsCount').innerText = totalPoints;
      }

      async function loadMaterials() {
        const materials = getSellerMaterials();
        const tbody = document.getElementById('materialsTableBody');
        tbody.innerHTML = '';

        if (materials.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:2rem; opacity:0.5;">${translations[currentLang].no_mats}</td></tr>`;
          return;
        }

        materials.slice().reverse().forEach(m => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><img src="${m.imageBase64 || 'https://via.placeholder.com/50'}" class="material-img" alt="img"></td>
            <td><strong>${m.userName || 'Unknown'}</strong></td>
            <td><span class="role-badge">${m.name}</span></td>
            <td>${m.weight}g</td>
            <td>⭐ ${m.points}</td>
            <td>${new Date(m.date).toLocaleDateString()}</td>
            <td>
              <button class="delete-btn" onclick="deleteMaterial('${m.id}')">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          `;
          tbody.appendChild(row);
        });
      }

      window.deleteMaterial = function(id) {
        if (!confirm(translations[currentLang].confirm_del_mat)) return;
        let materials = JSON.parse(localStorage.getItem('materials') || '[]');
        materials = materials.filter(m => String(m.id) !== String(id));
        localStorage.setItem('materials', JSON.stringify(materials));
        loadMaterials();
        loadHomeStats();
      };

      async function loadUsers() {
        const localUsers = JSON.parse(localStorage.getItem('users') || '[]');
        const tbody = document.getElementById('usersTableBody');
        const filter = document.getElementById('roleFilter').value;
        tbody.innerHTML = '';

        const filtered = filter === 'all' ? localUsers : localUsers.filter(u => u.role === filter);

        if (filtered.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:2rem; opacity:0.5;">${translations[currentLang].no_users}</td></tr>`;
          return;
        }

        filtered.forEach(u => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><strong>${u.username || u.name}</strong></td>
            <td>${u.phone || 'N/A'}</td>
            <td><span class="role-badge">${u.role}</span></td>
            <td>
              <button class="delete-btn" onclick="deleteUser('${u.id}', '${u.username}')">
                <i class="fas fa-user-minus"></i>
              </button>
            </td>
          `;
          tbody.appendChild(row);
        });
      }

      window.deleteUser = async function(id, name) {
        if (!confirm(translations[currentLang].confirm_del_user.replace('{name}', name))) return;
        
        // Delete from LocalStorage
        let users = JSON.parse(localStorage.getItem('users') || '[]');
        users = users.filter(u => String(u.id) !== String(id) && u.username !== name);
        localStorage.setItem('users', JSON.stringify(users));

        // Delete from Dexie
        if (id && !isNaN(id)) await dbUsers.Users.delete(Number(id));

        loadUsers();
        loadHomeStats();
      };

      async function loadRewards() {
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        const materials = getSellerMaterials();
        const tbody = document.getElementById('rewardsTableBody');
        tbody.innerHTML = '';

        const userStats = users.filter(u => u.role === 'seller').map(u => {
          const userMats = materials.filter(m => String(m.userId) === String(u.id) || m.userName === u.username);
          const totalPoints = userMats.reduce((sum, m) => sum + (Number(m.points) || 0), 0);
          const totalWeight = userMats.reduce((sum, m) => sum + (Number(m.weight) || 0), 0) / 1000;
          
          let milestone = 'Bronze';
          if (totalPoints >= 5000) milestone = 'Gold';
          else if (totalPoints >= 1000) milestone = 'Silver';

          return { name: u.username, points: totalPoints, weight: totalWeight, milestone };
        });

        userStats.sort((a, b) => b.points - a.points).forEach(s => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><strong>${s.name}</strong></td>
            <td>⭐ ${s.points}</td>
            <td>${s.weight.toFixed(2)} kg</td>
            <td><span class="role-badge">${s.milestone}</span></td>
          `;
          tbody.appendChild(row);
        });
      }

      document.getElementById('roleFilter').addEventListener('change', loadUsers);

      // ─── Init ───────────────────────────────────────────
      setTheme(localStorage.getItem('adminTheme') || 'light');
      applyLanguage(currentLang);
      loadHomeStats();
    })();
  </script>
</body>
</html>
