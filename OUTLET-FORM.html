<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>BEKYA · Outlet Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --surface: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --border-light: #e2e8f0;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --accent-green: #0A3D2A;
            --accent-soft: #eef7f2;
            --danger: #dc2626;
            --icon-color: #0A3D2A;
            --radius: 20px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --surface: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --border-light: #334155;
            --card-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            --accent-green: #22c55e;
            --accent-soft: rgba(34, 197, 94, 0.15);
            --danger: #ef4444;
            --icon-color: #ffffff;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.3s ease;
            min-height: 100vh;
        }

        .app-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        /* Header */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            background: var(--surface);
            padding: 1rem 1.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--border-light);
            box-shadow: var(--card-shadow);
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
            color: inherit;
        }

        .logo-img {
            height: 40px;
            object-fit: contain;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent-green);
            letter-spacing: -1px;
        }

        .top-actions {
            display: flex;
            gap: 1rem;
        }

        .icon-btn {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            background: var(--surface);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
            transform: translateY(-2px);
        }

        /* Dashboard Layout */
        .dashboard-container {
            display: flex;
            gap: 2rem;
            position: relative;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border-light);
            padding: 1.5rem 1rem;
            position: sticky;
            top: 20px;
            height: fit-content;
            transition: all 0.3s ease;
        }

        .sidebar.collapsed {
            display: none;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.9rem 1.2rem;
            border-radius: 14px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            cursor: pointer;
            font-size: 1rem;
        }

        .menu-item i {
            font-size: 1.2rem;
            width: 24px;
            color: var(--icon-color);
        }

        .menu-item:hover {
            background: var(--accent-soft);
            color: var(--accent-green);
        }

        .menu-item.active {
            background: var(--accent-green);
            color: white;
            box-shadow: 0 8px 20px rgba(10, 61, 42, 0.2);
        }

        .menu-item.active i {
            color: white;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border-light);
            padding: 1.8rem;
            box-shadow: var(--card-shadow);
        }

        .section {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .section.active-section {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--accent-green);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-secondary);
            padding: 1.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--border-light);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        /* Materials Grid */
        .materials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .material-card {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--border-light);
            overflow: hidden;
            transition: all 0.2s;
            position: relative;
        }

        .material-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--card-shadow);
        }

        .material-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #e2e8f0;
        }

        .card-content {
            padding: 1rem;
        }

        .badge {
            background: var(--accent-soft);
            color: var(--accent-green);
            padding: 0.25rem 0.7rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .sold-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--accent-green);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .btn-primary {
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-top: 0.5rem;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 0.5rem 1rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .confirm-box {
            margin-top: 0.8rem;
            padding: 0.8rem;
            border-top: 1px solid var(--border-light);
            display: none;
        }

        .confirm-box.active {
            display: block;
        }

        .confirm-box input {
            width: 100%;
            padding: 0.6rem;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            background: var(--surface);
            margin: 0.4rem 0;
        }

        .flex-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        /* Settings */
        .settings-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 300px;
        }
        /* Users table */
        .content-card {
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border-light);
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: var(--bg-secondary);
            padding: 1rem 1.2rem;
            text-align: left;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td {
            padding: 1rem 1.2rem;
            border-bottom: 1px solid var(--border-light);
            font-size: 0.95rem;
        }
        tr:last-child td { border-bottom: none; }

        /* Mobile */
        @media (max-width: 1024px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100vh;
                z-index: 1000;
                transform: translateX(-100%);
                border-radius: 0;
                width: 260px;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .sidebar-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.4);
                backdrop-filter: blur(4px);
                z-index: 999;
                display: none;
            }

            .sidebar-overlay.active {
                display: block;
            }

            .dashboard-container {
                flex-direction: column;
            }
        }

        @media (max-width: 768px) {
            .app-wrapper {
                padding: 1rem;
            }

            .main-content {
                padding: 1rem;
            }

            h2 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

<body data-theme="light">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="app-wrapper">
        <header class="header-bar">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <button class="icon-btn" id="sidebarToggle"><i class="fas fa-bars"></i></button>
                <a href="index.html" class="logo-wrapper">
                    <img src="logo.png" alt="Logo" class="logo-img">
                    <span class="logo">BEKYA · Outlet</span>
                </a>
            </div>
            <div class="top-actions">
                <button class="icon-btn" id="themeToggle"><i class="fas fa-sun"></i></button>
                <button class="icon-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <div class="dashboard-container">
            <aside class="sidebar" id="sidebar">
                <nav class="sidebar-menu">
                    <button class="menu-item active" data-section="overview"><i class="fas fa-home"></i>
                        Overview</button>
                    <button class="menu-item" data-section="pending"><i class="fas fa-clock"></i> Pending
                        Materials</button>
                    <button class="menu-item" data-section="sold"><i class="fas fa-check-circle"></i> Sold
                        Materials</button>
                    <button class="menu-item" data-section="users"><i class="fas fa-users"></i> Users</button>
                    <button class="menu-item" data-section="settings"><i class="fas fa-cog"></i> Settings</button>
                </nav>
            </aside>

            <main class="main-content">
                <!-- Overview Section -->
                <section id="overview" class="section active-section">
                    <h2><i class="fas fa-chart-line"></i> Outlet Overview</h2>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-label">Pending Materials</div>
                            <div class="stat-value" id="pendingCount">0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Sold Today</div>
                            <div class="stat-value" id="soldTodayCount">0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Total Points Awarded</div>
                            <div class="stat-value" id="totalPointsAwarded">0</div>
                        </div>
                    </div>
                </section>

                <!-- Pending Section -->
                <section id="pending" class="section">
                    <h2><i class="fas fa-hourglass-half"></i> Pending Materials</h2>
                    <div id="pendingList" class="materials-grid"></div>
                </section>

                <!-- Sold Section -->
                <section id="sold" class="section">
                    <h2><i class="fas fa-history"></i> Sold Materials</h2>
                    <div id="soldList" class="materials-grid"></div>
                </section>

                <!-- Users (read-only) -->
                <section id="users" class="section">
                    <h2><i class="fas fa-users"></i> Users</h2>
                    <div class="content-card">
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Phone</th>
                                        <th>Role</th>
                                    </tr>
                                </thead>
                                <tbody id="usersTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <!-- Settings Section -->
                <section id="settings" class="section">
                    <h2><i class="fas fa-sliders-h"></i> Settings</h2>
                    <div class="settings-buttons">
                        <button class="btn-secondary" id="settingsThemeToggle"><i class="fas fa-adjust"></i> Switch
                            Theme</button>
                        <button class="btn-secondary" id="settingsLangToggle"><i class="fas fa-language"></i> Switch
                            Language</button>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script>
        (function () {
            // ──────────────────────────────────────────────────────────
            // LOCALSTORAGE KEYS (unified with admin/seller)
            // ──────────────────────────────────────────────────────────
            const STORAGE_MATERIALS = 'materials';
            const STORAGE_USERS = 'users';

            let currentUserId = localStorage.getItem('currentUserId');
            let currentLang = localStorage.getItem('outletLang') || 'en';

            // Translations
            const translations = {
                en: {
                    pending: "Pending Materials",
                    sold: "Sold Materials",
                    overview: "Overview",
                    users: "Users",
                    settings: "Settings",
                    confirmSale: "Confirm Sale",
                    points: "Points",
                    salePhoto: "Sale Photo",
                    save: "Save",
                    cancel: "Cancel",
                    soldLabel: "SOLD",
                    pendingCount: "Pending Materials",
                    soldToday: "Sold Today",
                    totalPoints: "Total Points Awarded",
                    noPending: "No pending materials",
                    noSold: "No sold materials yet",
                    noUsers: "No users found"
                },
                ar: {
                    pending: "المواد المعلقة",
                    sold: "المواد المباعة",
                    overview: "نظرة عامة",
                    users: "المستخدمون",
                    settings: "الإعدادات",
                    confirmSale: "تأكيد البيع",
                    points: "النقاط",
                    salePhoto: "صورة البيع",
                    save: "حفظ",
                    cancel: "إلغاء",
                    soldLabel: "تم البيع",
                    pendingCount: "المواد المعلقة",
                    soldToday: "المباع اليوم",
                    totalPoints: "إجمالي النقاط الممنوحة",
                    noPending: "لا توجد مواد معلقة",
                    noSold: "لا توجد مواد مباعة بعد",
                    noUsers: "لا يوجد مستخدمون"
                }
            };

            function t(key) {
                return translations[currentLang][key] || translations.en[key] || key;
            }

            // Helper: get materials
            function getMaterials() {
                const stored = localStorage.getItem(STORAGE_MATERIALS);
                return stored ? JSON.parse(stored) : [];
            }

            function saveMaterials(materials) {
                localStorage.setItem(STORAGE_MATERIALS, JSON.stringify(materials));
            }

            // Render Overview
            function renderOverview() {
                const materials = getMaterials();
                const pending = materials.filter(m => !m.sold);
                const sold = materials.filter(m => m.sold);
                const today = sold.filter(m => {
                    if (!m.soldDate) return false;
                    const soldDate = new Date(m.soldDate);
                    const now = new Date();
                    return soldDate.toDateString() === now.toDateString();
                });
                const totalAwarded = sold.reduce((sum, m) => sum + (Number(m.pointsByOutlet) || 0), 0);

                document.getElementById('pendingCount').innerText = pending.length;
                document.getElementById('soldTodayCount').innerText = today.length;
                document.getElementById('totalPointsAwarded').innerText = totalAwarded;
            }

            // Create material card for pending/sold
            function createMaterialCard(material, isPending) {
                const card = document.createElement('div');
                card.className = 'material-card';
                if (!isPending) card.classList.add('sold');

                card.innerHTML = `
                    ${!isPending ? '<div class="sold-badge">' + t('soldLabel') + '</div>' : ''}
                    <img src="${material.imageBase64 || 'https://via.placeholder.com/300x180?text=BEKYA'}" alt="material">
                    <div class="card-content">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <strong>${material.name || 'Material'}</strong>
                            <span class="badge">${material.weight}g</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; margin-top:0.5rem;">
                            <small><i class="fas fa-user"></i> ${material.userName || 'Unknown'}</small>
                            <small><i class="far fa-calendar"></i> ${new Date(material.date).toLocaleDateString()}</small>
                        </div>
                        ${isPending ? `
                            <button class="btn-primary confirm-action-btn"><i class="fas fa-check-circle"></i> ${t('confirmSale')}</button>
                            <div class="confirm-box">
                                <label>${t('points')}</label>
                                <input type="number" class="points-input" value="${material.weight || 0}" min="0">
                                <label>${t('salePhoto')}</label>
                                <input type="file" class="photo-input" accept="image/*">
                                <div class="flex-buttons">
                                    <button class="btn-primary save-confirm"><i class="fas fa-save"></i> ${t('save')}</button>
                                    <button class="btn-secondary cancel-confirm">${t('cancel')}</button>
                                </div>
                            </div>
                        ` : `
                            <div style="margin-top:0.5rem;">
                                <small><i class="fas fa-star"></i> Points: ${material.pointsByOutlet || 0}</small>
                                ${material.salePhotoBase64 ? `<div><small><i class="fas fa-camera"></i> Sale photo attached</small></div>` : ''}
                            </div>
                        `}
                    </div>
                `;

                if (isPending) {
                    const confirmBtn = card.querySelector('.confirm-action-btn');
                    const box = card.querySelector('.confirm-box');
                    const cancelBtn = card.querySelector('.cancel-confirm');
                    const saveBtn = card.querySelector('.save-confirm');

                    confirmBtn.addEventListener('click', () => {
                        box.classList.add('active');
                    });

                    cancelBtn.addEventListener('click', () => {
                        box.classList.remove('active');
                    });

                    saveBtn.addEventListener('click', async () => {
                        const pointsInput = card.querySelector('.points-input');
                        const fileInput = card.querySelector('.photo-input');
                        const awardedPoints = parseInt(pointsInput.value) || 0;

                        let photoBase64 = null;
                        if (fileInput.files && fileInput.files[0]) {
                            photoBase64 = await readFileAsBase64(fileInput.files[0]);
                        }

                        // Update material in localStorage
                        const materials = getMaterials();
                        const index = materials.findIndex(m => String(m.id) === String(material.id));
                        if (index !== -1) {
                            materials[index].sold = true;
                            materials[index].soldDate = new Date().toISOString();
                            materials[index].pointsByOutlet = awardedPoints;
                            materials[index].salePhotoBase64 = photoBase64;
                            materials[index].outletConfirmed = true;
                            saveMaterials(materials);
                        }

                        // Refresh UI
                        renderPending();
                        renderSold();
                        renderOverview();
                    });
                }

                return card;
            }

            function readFileAsBase64(file) {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }

            function renderPending() {
                const container = document.getElementById('pendingList');
                if (!container) return;
                const materials = getMaterials();
                const pending = materials.filter(m => !m.sold).reverse();

                if (pending.length === 0) {
                    container.innerHTML = `<div class="stat-card" style="text-align:center;">${t('noPending')}</div>`;
                    return;
                }

                container.innerHTML = '';
                pending.forEach(m => {
                    container.appendChild(createMaterialCard(m, true));
                });
            }

            function renderSold() {
                const container = document.getElementById('soldList');
                if (!container) return;
                const materials = getMaterials();
                const sold = materials.filter(m => m.sold).reverse();

                if (sold.length === 0) {
                    container.innerHTML = `<div class="stat-card" style="text-align:center;">${t('noSold')}</div>`;
                    return;
                }

                container.innerHTML = '';
                sold.forEach(m => {
                    container.appendChild(createMaterialCard(m, false));
                });
            }

            // ──────────────────────────────────────────────────────────
            // Navigation & Sidebar
            // ──────────────────────────────────────────────────────────
            const sections = document.querySelectorAll('.section');
            const menuItems = document.querySelectorAll('.menu-item');
            const sidebar = document.getElementById('sidebar');
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebarOverlay = document.getElementById('sidebarOverlay');

            function switchSection(sectionId) {
                sections.forEach(s => s.classList.remove('active-section'));
                document.getElementById(sectionId).classList.add('active-section');
                menuItems.forEach(i => i.classList.remove('active'));
                document.querySelector(`.menu-item[data-section="${sectionId}"]`).classList.add('active');

                if (sectionId === 'overview') renderOverview();
                if (sectionId === 'pending') renderPending();
                if (sectionId === 'sold') renderSold();
                if (sectionId === 'users') renderUsers();
            }

            menuItems.forEach(item => {
                item.addEventListener('click', () => {
                    const section = item.dataset.section;
                    if (section) switchSection(section);
                    if (window.innerWidth <= 1024) {
                        sidebar.classList.remove('active');
                        sidebarOverlay.classList.remove('active');
                    }
                });
            });

            function toggleSidebar() {
                if (window.innerWidth <= 1024) {
                    sidebar.classList.toggle('active');
                    sidebarOverlay.classList.toggle('active');
                } else {
                    sidebar.classList.toggle('collapsed');
                }
            }

            sidebarToggle.addEventListener('click', toggleSidebar);
            sidebarOverlay.addEventListener('click', () => {
                sidebar.classList.remove('active');
                sidebarOverlay.classList.remove('active');
            });

            // ──────────────────────────────────────────────────────────
            // Theme
            // ──────────────────────────────────────────────────────────
            function setTheme(theme) {
                document.body.setAttribute('data-theme', theme);
                localStorage.setItem('outletTheme', theme);
                const icon = document.querySelector('#themeToggle i');
                if (icon) icon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
            }

            const savedTheme = localStorage.getItem('outletTheme') || 'light';
            setTheme(savedTheme);

            document.getElementById('themeToggle').addEventListener('click', () => {
                const current = document.body.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                setTheme(next);
            });

            document.getElementById('settingsThemeToggle')?.addEventListener('click', () => {
                const current = document.body.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                setTheme(next);
            });

            // ──────────────────────────────────────────────────────────
            // Language
            // ──────────────────────────────────────────────────────────
            function applyLanguage() {
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.dataset.i18n;
                    if (translations[currentLang][key]) el.innerText = translations[currentLang][key];
                });
                // Update static texts
                document.querySelector('.menu-item[data-section="overview"] span')?.setAttribute('data-i18n', 'overview');
                document.querySelector('.menu-item[data-section="pending"] span')?.setAttribute('data-i18n', 'pending');
                document.querySelector('.menu-item[data-section="sold"] span')?.setAttribute('data-i18n', 'sold');
                document.querySelector('.menu-item[data-section="users"] span')?.setAttribute('data-i18n', 'users');
                document.querySelector('.menu-item[data-section="settings"] span')?.setAttribute('data-i18n', 'settings');

                const overviewTitle = document.querySelector('#overview h2');
                if (overviewTitle) overviewTitle.innerHTML = `<i class="fas fa-chart-line"></i> ${t('overview')}`;
                const pendingTitle = document.querySelector('#pending h2');
                if (pendingTitle) pendingTitle.innerHTML = `<i class="fas fa-hourglass-half"></i> ${t('pending')}`;
                const soldTitle = document.querySelector('#sold h2');
                if (soldTitle) soldTitle.innerHTML = `<i class="fas fa-history"></i> ${t('sold')}`;
                const usersTitle = document.querySelector('#users h2');
                if (usersTitle) usersTitle.innerHTML = `<i class="fas fa-users"></i> ${t('users')}`;
                const settingsTitle = document.querySelector('#settings h2');
                if (settingsTitle) settingsTitle.innerHTML = `<i class="fas fa-sliders-h"></i> ${t('settings')}`;

                // Update stat labels
                const statLabels = document.querySelectorAll('.stat-label');
                if (statLabels[0]) statLabels[0].innerText = t('pendingCount');
                if (statLabels[1]) statLabels[1].innerText = t('soldToday');
                if (statLabels[2]) statLabels[2].innerText = t('totalPoints');

                renderPending();
                renderSold();
                renderOverview();
                renderUsers();
            }

            function setLanguage(lang) {
                currentLang = lang;
                localStorage.setItem('outletLang', lang);
                document.dir = lang === 'ar' ? 'rtl' : 'ltr';
                applyLanguage();
            }

            const savedLang = localStorage.getItem('outletLang') || 'en';
            setLanguage(savedLang);

            document.getElementById('settingsLangToggle')?.addEventListener('click', () => {
                const newLang = currentLang === 'en' ? 'ar' : 'en';
                setLanguage(newLang);
            });

            // ──────────────────────────────────────────────────────────
            // Logout
            // ──────────────────────────────────────────────────────────
            document.getElementById('logoutBtn').addEventListener('click', () => {
                if (confirm(currentLang === 'ar' ? 'هل تريد تسجيل الخروج؟' : 'Are you sure you want to logout?')) {
                    localStorage.removeItem('currentUserId');
                    localStorage.removeItem('userRole');
                    window.location.href = 'login.html';
                }
            });

            // Users render (read-only)
            function renderUsers() {
                const tbody = document.getElementById('usersTableBody');
                if (!tbody) return;
                let users = [];
                try {
                    users = JSON.parse(localStorage.getItem('users') || '[]');
                    if (!Array.isArray(users)) users = [];
                } catch (e) {
                    users = [];
                }
                tbody.innerHTML = '';
                if (users.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:1.5rem; opacity:0.6;">${t('noUsers')}</td></tr>`;
                    return;
                }
                users.forEach(u => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${u.username || u.name || ''}</strong></td>
                        <td>${u.phone || 'N/A'}</td>
                        <td>${u.role || ''}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // ──────────────────────────────────────────────────────────
            // Initial render
            // ──────────────────────────────────────────────────────────
            renderOverview();
            renderPending();
            renderSold();
            renderUsers();
            switchSection('overview');
        })();
    </script>
</body>

</html>
